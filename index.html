<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>SAMC JGVRP Speedometer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="speedometer" class="speedo-dashboard">

        <!-- Embedded Minimalist Sync Panel (Positioned Directly Above Speedo Layout) -->
        <div id="sync-panel" class="sync-panel-embedded hide no-drag">
            <div class="sync-top-row">
                <!-- Mode Toggle (Segmented control) -->
                <div class="sync-segmented-control">
                    <button id="sync-role-host" class="sync-tab-btn active">Host</button>
                    <button id="sync-role-client" class="sync-tab-btn">Client</button>
                </div>
                <button id="btn-sync-close" class="sync-close-btn" title="Close Panel">&times;</button>
            </div>

            <!-- Host Content -->
            <div id="sync-host-panel" class="sync-panel-content">
                <div class="sync-input-row">
                    <div class="sync-code-box">
                        <span id="sync-host-code" class="sync-code-text">------</span>
                    </div>
                    <button id="btn-host-connect" class="sync-btn-connect">Connect</button>
                    <button id="btn-host-disconnect" class="sync-btn-danger hide">Disconnect</button>
                </div>
            </div>

            <!-- Client Content -->
            <div id="sync-client-panel" class="sync-panel-content hide">
                <div class="sync-input-row">
                    <input type="text" id="sync-client-code-input" maxlength="6" placeholder="CODE" autocomplete="off">
                    <button id="btn-sync-connect" class="sync-btn-connect">Connect</button>
                    <button id="btn-sync-disconnect" class="sync-btn-danger hide">Disconnect</button>
                </div>
            </div>

            <!-- Compact Status State -->
            <div class="sync-status-compact">
                <span id="sync-status-dot" class="status-dot disconnected"></span>
                <span id="sync-status-text">Disconnected</span>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="speedo-controls no-drag">
            <button id="btn-scale-down" class="control-btn" title="Scale Down">−</button>
            <button id="btn-reset" class="control-btn" title="Reset Position & Scale">↺</button>
            <button id="btn-scale-up" class="control-btn" title="Scale Up">+</button>
            <button id="btn-sync" class="control-btn" title="Link to External Screen">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                    <path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 10h-4v-7h4v7z"/>
                </svg>
            </button>
        </div>

        <!-- Main Speedometer Dials -->
        <div class="speedo-panel dials-panel">
            <div class="speedo-dials-container">
                <div id="speed-bg-speed" class="speed-bg-layer speed-bg-speed"></div>
                <div id="speed-bg-rpm" class="speed-bg-layer speed-bg-rpm"></div>
                <canvas id="speedo-canvas" width="310" height="180"></canvas>

                <div class="speed-overlay-container">
                    <span id="speed-display">0</span>
                    <span id="speed-unit">mph</span>
                    <span id="odometer" class="odometer-inline">0.0 mi</span>
                </div>

                <div class="speedo-indicators">
                    <div id="indicator-left" class="indicator-unit indicator-arrow">
                        <svg viewBox="0 0 512 512" width="100%" height="100%">
                            <polygon points="316.508,153.598 316.508,18.616 0,256 316.508,493.384 316.508,358.402 512,358.402 512,153.598" />
                        </svg>
                    </div>

                    <div id="indicator-headlights" class="indicator-unit indicator-headlight">
                        <svg viewBox="0 0 256 256" width="100%" height="100%">
                            <path d="M144,64V192a16.01833,16.01833,0,0,1-16,16H88A79.99987,79.99987,0,0,1,8.002,127.39453C8.32715,83.61621,44.61914,48,88.90381,48H128A16.01833,16.01833,0,0,1,144,64Zm96,104H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16ZM168,88h72a8,8,0,0,0,0-16H168a8,8,0,0,0,0,16Zm72,16H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Zm0,32H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Z" />
                        </svg>
                    </div>

                    <div id="indicator-seatbelt" class="indicator-unit indicator-seatbelt">
                        <div class="seatbelt-icon"></div>
                    </div>

                    <div id="indicator-engine" class="indicator-unit indicator-engine">
                        <div class="engine-icon"></div>
                    </div>

                    <div id="indicator-right" class="indicator-unit indicator-arrow">
                        <svg viewBox="0 0 512 512" width="100%" height="100%">
                            <polygon points="512,256.001 195.491,18.616 195.491,153.599 0,153.599 0,358.403 195.491,358.403 195.491,493.384" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bottom-status-capsule">
                <div class="linear-gauge-container">
                    <span class="linear-icon">
                        <svg viewBox="0 0 24 24" width="14" height="14">
                            <path fill="#2ecc71" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" />
                        </svg>
                    </span>
                    <div class="linear-progress-bar">
                        <div id="health-fill" class="progress-fill health-bar-fill" style="width: 100%"></div>
                        <span id="health-text" class="linear-value">100%</span>
                    </div>
                </div>

                <div class="linear-gauge-container">
                    <span class="linear-icon">
                        <svg viewBox="0 0 24 24" width="14" height="14">
                            <path fill="#f1c40f" d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 002.5 2.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5a2.5 2.5 0 005 0V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5z" />
                        </svg>
                    </span>
                    <div class="linear-progress-bar">
                        <div id="fuel-fill" class="progress-fill fuel-bar-fill" style="width: 100%"></div>
                        <span id="fuel-text" class="linear-value">100%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Active Sync Indicator Pill -->
    <div id="sync-active-pill" class="sync-active-pill hide">
        <span class="pulse-dot"></span>
        <span id="sync-active-text" class="pill-text">Syncing to Android</span>
        <button id="btn-restore-hud" class="restore-hud-btn" title="Restore HUD & Disconnect">&times;</button>
    </div>

    <script src="peer.js"></script>
    <script src="app.js"></script>
</body>

</html>
